    <!-- Top Arrow Segment -->
    <path d="M22 22h16l-3-4" />
    <path d="M38 22l-3 4" />
    
    <!-- Right Downward Arc -->
    <path d="M42 26c3 4 3 10 0 14" />
    <path d="M42 40l-2-4" />
    <path d="M42 40l4-2" />

    <!-- Bottom Leftward Segment -->
    <path d="M40 44H24l3 4" />
    <path d="M24 44l3-4" />

    <!-- Left Upward Arc -->
    <path d="M20 38c-3-4-3-10 0-14" />
  </g>

  <!-- Center Leaf Bud -->
  <path d="M32 28c3 0 5 2 5 5s-3 4-5 4-5-2-5-4 2-5 5-5z" fill="#a7f3d0" opacity="0.9" />
