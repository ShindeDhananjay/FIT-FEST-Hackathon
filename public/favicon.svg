<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ecoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="ecoGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Modern Rounded Emerald Square -->
  <rect width="64" height="64" rx="16" fill="url(#ecoBg)" />

  <!-- Inner Soft Ring -->
  <circle cx="32" cy="32" r="24" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none" />

  <!-- EcoLoop Recycling Arrows in Pure White -->
